<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="100%" height="auto">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .window-bar { fill: #161b22; }
      .btn-close { fill: #ff5f56; }
      .btn-min { fill: #ffbd2e; }
      .btn-max { fill: #27c93f; }
      .text-title { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #8b949e; }
      .prompt-user { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; fill: #58a6ff; font-weight: 600; }
      .prompt-sep { stroke: #30363d; stroke-width: 1; }
      .ascii-art { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #58a6ff; white-space: pre; }
      .label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13.5px; fill: #d29922; font-weight: 500; }
      .dots { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; fill: #30363d; }
      .value { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13.5px; fill: #e6edf3; }
      .badge { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; fill: #7ee787; }
    </style>
  </defs>

  <!-- Background Window -->
  <rect x="1" y="1" width="778" height="318" class="terminal-bg" />

  <!-- Window Header Bar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 767 1 A 12 12 0 0 1 779 13 L 779 38 L 1 38 Z" class="window-bar" />
  <circle cx="20" cy="19" r="6" class="btn-close" />
  <circle cx="40" cy="19" r="6" class="btn-min" />
  <circle cx="60" cy="19" r="6" class="btn-max" />
  <text x="82" y="24" class="text-title">developer@system: ~ (sysfetch)</text>

  <!-- Left: Stylized Code Terminal Glyph -->
  <g transform="translate(45, 75)">
    <text class="ascii-art" xml:space="preserve">
      <tspan x="0" y="20">    /\_____/\    </tspan>
      <tspan x="0" y="40">   /  o   o  \   </tspan>
      <tspan x="0" y="60">  ( ==  ^  == )  </tspan>
      <tspan x="0" y="80">   )         (   </tspan>
      <tspan x="0" y="100">  (           )  </tspan>
      <tspan x="0" y="120"> ( (  )   (  ) ) </tspan>
      <tspan x="0" y="140">(__(__)___(__)__)</tspan>
      <tspan x="0" y="175" class="badge">  [ SYSTEM ONLINE ] </tspan>
    </text>
  </g>

  <!-- Divider / Prompt Title -->
  <text x="260" y="80" class="prompt-user">developer@workspace</text>
  <line x1="260" y1="92" x2="730" y2="92" class="prompt-sep" />

  <!-- Specification Lines -->
  <!-- Line 1: Platforms -->
  <text x="260" y="130" class="label">Platforms</text>
  <text x="350" y="130" class="dots">. . . . . . . . . . . . . . . . . . . . . . . .</text>
  <text x="560" y="130" class="value">Web · Mobile · Desktop</text>

  <!-- Line 2: Frontend -->
  <text x="260" y="170" class="label">Frontend</text>
  <text x="350" y="170" class="dots">. . . . . . . . . . . . . . . . . . . . . . . .</text>
  <text x="500" y="170" class="value">React · Next.js · React Native</text>

  <!-- Line 3: Backend -->
  <text x="260" y="210" class="label">Backend</text>
  <text x="350" y="210" class="dots">. . . . . . . . . . . . . . . . . . . . . . . .</text>
  <text x="515" y="210" class="value">Node.js · Express.js · Django</text>

  <!-- Line 4: Focus -->
  <text x="260" y="250" class="label">Core Focus</text>
  <text x="350" y="250" class="dots">. . . . . . . . . . . . . . . . . . . . . . . .</text>
  <text x="535" y="250" class="value">UI / APIs / Integrations</text>
</svg>